<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="900">
<title>Vatnshiti - Vok Baths</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: transparent;            /* overlays cleanly on LoopSign */
  }
  body {
    font-family: "Century Gothic", "Questrial", "Futura",
                 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #111111;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .board {
    width: 100%;
    padding: clamp(24px, 4vmin, 72px);
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    column-gap: clamp(24px, 4vmin, 72px);
    row-gap: clamp(10px, 1.8vmin, 26px);
    align-items: center;
    justify-items: center;
  }
  .label {
    grid-row: 1;
    font-size: clamp(16px, 3.1vmin, 46px);
    font-weight: 400;
    line-height: 1.28;
    text-align: center;
    white-space: nowrap;
  }
  .label .en { display: block; }
  .label.lake { grid-column: 1; }
  .label.air  { grid-column: 3; }
  .value {
    grid-row: 2;
    font-size: clamp(58px, 13.5vmin, 210px);
    font-weight: 300;
    line-height: 1.0;
    letter-spacing: -0.005em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .value.lake { grid-column: 1; }
  .value.air  { grid-column: 3; }
  .value .unit { font-weight: 300; }
  .divider {
    grid-row: 2; grid-column: 2;
    font-size: clamp(58px, 13.5vmin, 210px);   /* height tracks the numerals */
    width: clamp(2px, 0.32vmin, 5px);
    height: 0.92em;
    background: currentColor;
  }
  .stamp {
    display: none;
    grid-row: 3; grid-column: 1 / -1;
    margin-top: clamp(12px, 2.2vmin, 30px);
    font-size: clamp(12px, 1.7vmin, 24px);
    font-weight: 400;
    opacity: 0.55;
    text-align: center;
  }
  @media (max-aspect-ratio: 4/5) {
    .grid { grid-template-columns: 1fr; row-gap: clamp(6px, 1.2vmin, 18px); }
    .label.lake { grid-row: 1; grid-column: 1; }
    .value.lake { grid-row: 2; grid-column: 1; }
    .label.air  { grid-row: 3; grid-column: 1; margin-top: 4vmin; }
    .value.air  { grid-row: 4; grid-column: 1; }
    .divider { display: none; }
    .stamp { grid-row: 5; grid-column: 1; }
  }
</style>
</head>
<body>
  <div class="board">
    <div class="grid">
      <div class="label lake">Hitastig Urri&eth;avatns<span class="en">Lake Urri&eth;avatn temp.</span></div>
      <div class="label air">&Uacute;tihitastig<span class="en">Outside temp.</span></div>
      <div class="value lake">13,7<span class="unit"> &deg;C</span></div>
      <div class="divider"></div>
      <div class="value air">12,9<span class="unit"> &deg;C</span></div>
      <div class="stamp">S&iacute;&eth;asta sta&eth;festa m&aelig;ling / last confirmed reading: 22.08.2026 06:13</div>
    </div>
  </div>
</body>
</html>
